<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="menuToggle.emit()" aria-label="Toggle navigation" matTooltip="Toggle navigation">
    <mat-icon>{{ icons.menu }}</mat-icon>
  </button>

  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Employee Management System</span>
  </div>

  <span class="flex-1"></span>

  @if (user(); as currentUser) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      [attr.aria-label]="'Account menu for ' + currentUser.name"
      matTooltip="Account menu"
    >
      <mat-icon>{{ icons.accountCircle }}</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="px-4 py-2">
        <div class="font-medium">{{ currentUser.name }}</div>
        <div class="text-sm">{{ currentUser.email }}</div>
      </div>
      <button mat-menu-item type="button" routerLink="/account">
        <mat-icon>{{ icons.accountCircle }}</mat-icon>
        <span>Account</span>
      </button>
      <button mat-menu-item type="button" (click)="logout.emit()">
        <mat-icon>{{ icons.logout }}</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
