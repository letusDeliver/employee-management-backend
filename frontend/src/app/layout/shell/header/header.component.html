<mat-toolbar color="primary">
  <button mat-icon-button (click)="menuToggle.emit()" aria-label="Toggle navigation">
    <mat-icon>{{ icons.menu }}</mat-icon>
  </button>

  <span class="ml-2">Employee Management System</span>

  <span class="flex-1"></span>

  @if (user(); as currentUser) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="userMenu"
      [attr.aria-label]="'Account menu for ' + currentUser.name"
    >
      <mat-icon>{{ icons.accountCircle }}</mat-icon>
    </button>
    <mat-menu #userMenu="matMenu">
      <div class="px-4 py-2">
        <div class="font-medium">{{ currentUser.name }}</div>
        <div class="text-sm">{{ currentUser.email }}</div>
      </div>
      <button mat-menu-item (click)="logout.emit()">
        <mat-icon>{{ icons.logout }}</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>
