<div class="overflow-x-auto">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table matSort (matSortChange)="onSort($event)" [dataSource]="rows()" class="w-full">
    @for (col of columns(); track col.key) {
      <ng-container [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header [disabled]="!col.sortable">
          {{ col.header }}
        </th>
        <td mat-cell *matCellDef="let row">
          @if (templateFor(col.key); as template) {
            <ng-container *ngTemplateOutlet="template; context: { $implicit: row, row: row }" />
          } @else {
            {{ cellValue(row, col.key) }}
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="p-4 text-sm" [attr.colspan]="displayedColumns().length">No results.</td>
    </tr>
  </table>

  <mat-paginator
    [length]="totalCount()"
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions()"
    (page)="onPage($event)"
  />
</div>
