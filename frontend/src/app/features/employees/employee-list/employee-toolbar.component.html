<div class="mb-4 flex flex-wrap items-end gap-2">
  <form [formGroup]="form" class="flex flex-wrap gap-2">
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix>{{ icons.search }}</mat-icon>
      <input matInput formControlName="search" />
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Department</mat-label>
      <input matInput formControlName="department" />
    </mat-form-field>
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Job title</mat-label>
      <input matInput formControlName="jobTitle" />
    </mat-form-field>
  </form>

  <span class="flex-1"></span>

  @if (sessionStore.hasAnyPermission('employee:create')) {
    <a mat-flat-button color="primary" routerLink="/employees/new">
      <mat-icon>{{ icons.add }}</mat-icon>
      New Employee
    </a>
  }
</div>
