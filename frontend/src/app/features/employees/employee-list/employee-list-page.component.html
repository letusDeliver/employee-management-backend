<app-page-header title="Employees">
  @if (sessionStore.hasAnyPermission('employee:create')) {
    <a pageHeaderActions mat-flat-button color="primary" routerLink="/employees/new">
      <mat-icon>{{ icons.add }}</mat-icon>
      New Employee
    </a>
  }
</app-page-header>

<app-employee-toolbar (filtersChange)="onFiltersChange($event)" />

@if (deleteError(); as message) {
  <app-inline-banner tone="error" [message]="message" />
}

@if (employeeStore.error(); as message) {
  <app-inline-banner tone="error" [message]="message" />
} @else if (!employeeStore.loading() && employeeStore.employees().length === 0) {
  <app-empty-state
    [icon]="icons.badge"
    [title]="hasActiveFilters() ? 'No employees match your filters' : 'No employees yet'"
    [description]="
      hasActiveFilters()
        ? 'Try a different search or clear your filters.'
        : 'Employee records will appear here once you add one.'
    "
  />
} @else {
  <app-employee-table
    [rows]="employeeStore.employees()"
    [loading]="employeeStore.loading()"
    [pagination]="employeeStore.pagination()"
    [deletingIds]="deletingIds()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (deleteRequested)="onDeleteRequested($event)"
  />
}
