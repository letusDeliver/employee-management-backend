<h1 class="mb-4 text-2xl font-medium">Employees</h1>

<app-employee-toolbar (filtersChange)="onFiltersChange($event)" />

@if (deleteError(); as message) {
  <div class="mb-4 flex items-center gap-2 rounded-md bg-warn p-3 text-on-warn" role="alert">
    <mat-icon>{{ icons.error }}</mat-icon>
    <span>{{ message }}</span>
  </div>
}

@if (employeeStore.error(); as message) {
  <div class="flex items-center gap-2 rounded-md bg-warn p-3 text-on-warn" role="alert">
    <mat-icon>{{ icons.error }}</mat-icon>
    <span>{{ message }}</span>
  </div>
} @else {
  <app-employee-table
    [rows]="employeeStore.employees()"
    [loading]="employeeStore.loading()"
    [pagination]="employeeStore.pagination()"
    [deletingIds]="deletingIds()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (deleteRequested)="onDeleteRequested($event)"
  />
}
