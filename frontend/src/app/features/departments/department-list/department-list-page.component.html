<app-page-header title="Departments">
  @if (sessionStore.hasAnyPermission('department:create')) {
    <button pageHeaderActions mat-flat-button color="primary" type="button" (click)="openCreateDialog()">
      <mat-icon>{{ icons.add }}</mat-icon>
      New Department
    </button>
  }
</app-page-header>

<app-department-toolbar (filtersChange)="onFiltersChange($event)" />

@if (deleteError(); as message) {
  <app-inline-banner tone="error" [message]="message" />
}

@if (departmentStore.error(); as message) {
  <app-inline-banner tone="error" [message]="message" />
} @else if (!departmentStore.loading() && departmentStore.departments().length === 0) {
  <app-empty-state
    [icon]="icons.apartment"
    [title]="hasActiveFilters() ? 'No departments match your filters' : 'No departments yet'"
    [description]="
      hasActiveFilters()
        ? 'Try a different search or clear your filters.'
        : 'Department records will appear here once you add one.'
    "
  />
} @else {
  <app-department-table
    [rows]="departmentStore.departments()"
    [loading]="departmentStore.loading()"
    [pagination]="departmentStore.pagination()"
    [deletingIds]="deletingIds()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (editRequested)="openEditDialog($event)"
    (deleteRequested)="onDeleteRequested($event)"
  />
}
