@if (sessionStore.user(); as user) {
  <h1 class="mb-4 text-2xl font-medium">Welcome back, {{ user.name }}</h1>

  <mat-card class="max-w-md">
    <mat-card-header>
      <mat-card-title>Your profile</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <dl class="flex flex-col gap-2">
        <div>
          <dt class="text-sm">Name</dt>
          <dd>{{ user.name }}</dd>
        </div>
        <div>
          <dt class="text-sm">Email</dt>
          <dd>{{ user.email }}</dd>
        </div>
        <div>
          <dt class="text-sm">Roles</dt>
          <dd>
            <mat-chip-set>
              @for (role of user.roles; track role) {
                <mat-chip>{{ role }}</mat-chip>
              }
            </mat-chip-set>
          </dd>
        </div>
      </dl>
    </mat-card-content>
  </mat-card>

  <!-- Reserved for Feature 3: quick-navigation cards + widgets region (blueprint §4.3) -->
  <section aria-label="More" class="mt-6"></section>
}
