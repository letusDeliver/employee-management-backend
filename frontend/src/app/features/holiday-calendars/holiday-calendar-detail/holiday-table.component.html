<div class="overflow-x-auto">
  <table mat-table [dataSource]="rows()" class="w-full" aria-label="Holidays">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef class="max-sm:px-2!">Date</th>
      <!-- nowrap: with four columns the auto table layout otherwise breaks the date over two lines. -->
      <td mat-cell *matCellDef="let row" class="whitespace-nowrap max-sm:px-2!">{{ label(row) }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef class="max-sm:px-2!">Holiday</th>
      <td mat-cell *matCellDef="let row" class="max-sm:px-2!">
        {{ row.name }}
        <!-- On a phone the Type column is hidden to make room for the actions, so an optional holiday is
             flagged under its name instead. Mandatory is the default and needs no label there. -->
        @if (row.isOptional) {
          <span class="ds-caption block sm:hidden">Optional</span>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef class="max-sm:hidden">Type</th>
      <!-- Text, not colour alone: an optional holiday is one an employee may elect to work. -->
      <td mat-cell *matCellDef="let row" class="whitespace-nowrap max-sm:hidden">{{ row.isOptional ? 'Optional' : 'Mandatory' }}</td>
    </ng-container>

    <!-- stickyEnd: if a narrow screen still has to scroll sideways, Edit and Delete stay in reach. -->
    <ng-container matColumnDef="actions" stickyEnd>
      <th mat-header-cell *matHeaderCellDef class="max-sm:px-2!"></th>
      <td mat-cell *matCellDef="let row" class="max-sm:px-2!">
        <div class="flex flex-nowrap items-center">
          @if (canEdit()) {
            <button
              mat-icon-button
              type="button"
              [attr.aria-label]="'Edit ' + row.name"
              matTooltip="Edit"
              (click)="editRequested.emit(row)"
            >
              <mat-icon>{{ icons.edit }}</mat-icon>
            </button>
            @if (deletingIds().has(row.id)) {
              <mat-progress-spinner diameter="20" mode="indeterminate" [attr.aria-label]="'Deleting ' + row.name" />
            } @else {
              <button
                mat-icon-button
                type="button"
                [attr.aria-label]="'Delete ' + row.name"
                matTooltip="Delete"
                (click)="deleteRequested.emit(row)"
              >
                <mat-icon>{{ icons.delete }}</mat-icon>
              </button>
            }
          }
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
