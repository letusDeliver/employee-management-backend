<app-page-header title="Users" />

<mat-form-field class="w-full max-w-sm" subscriptSizing="dynamic">
  <mat-label>Search by name or email</mat-label>
  <mat-icon matPrefix>{{ icons.search }}</mat-icon>
  <input matInput [value]="usersStore.searchTerm()" (input)="onSearchChange($event)" />
</mat-form-field>

<div class="mt-4">
  @if (usersStore.loading()) {
    <mat-progress-spinner diameter="32" mode="indeterminate" aria-label="Loading users" />
  } @else if (usersStore.error(); as message) {
    <app-inline-banner tone="error" [message]="message" />
  } @else if (usersStore.filteredUsers().length === 0) {
    <app-empty-state
      [icon]="icons.people"
      [title]="usersStore.searchTerm() ? 'No users match your search' : 'No users yet'"
      [description]="
        usersStore.searchTerm() ? 'Try a different name or email.' : 'Registered users will appear here.'
      "
    />
  } @else {
    <app-user-table [rows]="usersStore.filteredUsers()" />
  }
</div>
