<app-page-header title="Users" />

<app-user-toolbar [initialFilters]="initialFilters()" (filtersChange)="onFiltersChange($event)" />

@if (usersStore.error(); as message) {
  <app-inline-banner tone="error" [message]="message" />
} @else if (!usersStore.loading() && usersStore.users().length === 0) {
  <app-empty-state
    [icon]="icons.people"
    [title]="hasActiveFilters() ? 'No users match your filters' : 'No users yet'"
    [description]="
      hasActiveFilters() ? 'Try a different search or role.' : 'Registered users will appear here.'
    "
  />
} @else {
  <app-user-table
    [rows]="usersStore.users()"
    [loading]="usersStore.loading()"
    [pagination]="usersStore.pagination()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  />
}
