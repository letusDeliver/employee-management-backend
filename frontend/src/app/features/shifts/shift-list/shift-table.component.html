<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [totalCount]="pagination().total"
  [pageIndex]="pagination().page - 1"
  [pageSize]="pagination().limit"
  (pageChange)="pageChange.emit($event)"
  (sortChange)="sortChange.emit($event)"
>
  <ng-template appDataTableCell="workingDays" let-row>
    {{ workingDays(row) }}
  </ng-template>

  <!-- nowrap on the cells with short, fixed-width content: with six columns the auto table layout
       otherwise squeezes them (the date broke over two lines, the action icons stacked). -->
  <ng-template appDataTableCell="startTime" let-row>
    <span class="whitespace-nowrap">
      {{ row.startTime }} – {{ row.endTime }}
      @if (overnight(row)) {
        <span class="ds-caption ml-1">(next day)</span>
      }
    </span>
  </ng-template>

  <ng-template appDataTableCell="status" let-row>
    <mat-chip-set>
      <mat-chip>{{ row.status === 'ACTIVE' ? 'Active' : 'Inactive' }}</mat-chip>
    </mat-chip-set>
  </ng-template>

  <ng-template appDataTableCell="createdAt" let-row>
    <span class="whitespace-nowrap">{{ row.createdAt | date: 'mediumDate' }}</span>
  </ng-template>

  <ng-template appDataTableCell="actions" let-row>
    <div class="flex flex-nowrap items-center">
      @if (canEdit()) {
        <button
          mat-icon-button
          type="button"
          [attr.aria-label]="'Edit ' + row.name"
          matTooltip="Edit"
          (click)="editRequested.emit(row)"
        >
          <mat-icon>{{ icons.edit }}</mat-icon>
        </button>
      }
      @if (canDelete()) {
        @if (deletingIds().has(row.id)) {
          <mat-progress-spinner diameter="20" mode="indeterminate" [attr.aria-label]="'Deleting ' + row.name" />
        } @else {
          <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Delete ' + row.name"
            matTooltip="Delete"
            (click)="deleteRequested.emit(row)"
          >
            <mat-icon>{{ icons.delete }}</mat-icon>
          </button>
        }
      }
    </div>
  </ng-template>
</app-data-table>
