<app-page-header
  title="Attendance records"
  description="Every employee's check-ins and check-outs. Correct a day here, or look up its computed status."
>
  <div pageHeaderActions class="flex flex-wrap items-center gap-2">
    <button mat-stroked-button type="button" (click)="openLookupDialog()">
      <mat-icon>{{ icons.factCheck }}</mat-icon>
      Check Status
    </button>
    @if (canCreate()) {
      <button mat-flat-button color="primary" type="button" (click)="openCreateDialog()">
        <mat-icon>{{ icons.add }}</mat-icon>
        New Record
      </button>
    }
  </div>
</app-page-header>

<app-attendance-toolbar [filters]="filters()" (filtersChange)="onFiltersChange($event)" />

@if (directory.error()) {
  <div class="mb-4">
    <app-inline-banner
      tone="warning"
      message="Employee names could not be loaded, so rows may read 'Unknown employee'."
      [showRetry]="true"
      (retry)="reloadDirectory()"
    />
  </div>
}

@if (deleteError(); as message) {
  <div class="mb-4">
    <app-inline-banner tone="error" [message]="message" />
  </div>
}

@if (store.error(); as message) {
  <app-inline-banner tone="error" [message]="message" [showRetry]="true" (retry)="store.loadList()" />
} @else if (!store.loading() && store.records().length === 0) {
  <app-empty-state
    [icon]="icons.factCheck"
    [title]="hasActiveFilters() ? 'No records match your filters' : 'No attendance records yet'"
    [description]="
      hasActiveFilters()
        ? 'Try a different employee or date range, or clear your filters.'
        : 'Records appear here as employees check in, or when you add one.'
    "
  />
} @else {
  <app-attendance-table
    [rows]="store.records()"
    [loading]="store.loading()"
    [pagination]="store.pagination()"
    [deletingIds]="deletingIds()"
    [canEdit]="canEdit()"
    [canDelete]="canDelete()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (editRequested)="openEditDialog($event)"
    (deleteRequested)="onDeleteRequested($event)"
  />
}
