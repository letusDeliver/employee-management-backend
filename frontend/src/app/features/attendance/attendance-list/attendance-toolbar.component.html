<form [formGroup]="form" class="mb-4 flex flex-wrap items-start gap-2">
  <div class="employee-field">
    <app-employee-picker formControlName="employeeId" label="Employee" />
  </div>

  <mat-form-field subscriptSizing="dynamic">
    <mat-label>Date range</mat-label>
    <mat-date-range-input [rangePicker]="rangePicker" formGroupName="range">
      <input matStartDate formControlName="start" placeholder="From" aria-label="From date" />
      <input matEndDate formControlName="end" placeholder="To" aria-label="To date" />
    </mat-date-range-input>
    <mat-datepicker-toggle matIconSuffix [for]="rangePicker" />
    <mat-date-range-picker #rangePicker />
  </mat-form-field>

  @if (hasFilters()) {
    <button mat-button type="button" class="clear-button" (click)="clear()">
      <mat-icon>{{ icons.close }}</mat-icon>
      Clear filters
    </button>
  }
</form>
